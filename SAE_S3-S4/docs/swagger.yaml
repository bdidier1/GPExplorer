  /api/users/me:
    get:
      tags: [Utilisateurs]
      summary: Récupérer le profil de l'utilisateur connecté
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil récupéré
        '401':
          description: Non authentifié
        '500':
          description: Erreur serveur
    put:
      tags: [Utilisateurs]
      summary: Mettre à jour le profil de l'utilisateur connecté
      description: Permet de modifier username, prénom, nom, email, téléphone, et de changer le mot de passe en fournissant currentPassword et newPassword.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Profil mis à jour
        '400':
          description: Données invalides ou mot de passe actuel incorrect
        '401':
          description: Non authentifié
        '404':
          description: Utilisateur introuvable
        '409':
          description: Email ou username déjà utilisé
        '500':
          description: Erreur serveur

